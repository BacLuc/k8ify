services:
  main:
    image: nginx
    labels:
      k8ify.podSecurityContext.fsGroup: "1000"
      k8ify.podSecurityContext.fsGroupChangePolicy: OnRootMismatch
      k8ify.securityContext.runAsUser: "1000"
  side:
    image: nginx
    labels:
      k8ify.partOf: main
      k8ify.securityContext.runAsUser: "2000"
      k8ify.securityContext.readOnlyRootFilesystem: "true"